fix = true
line-length = 80
src = ["src"]

[analyze]
detect-string-imports = true

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
# docstring-code-line-length = 60

[lint]
select = [
    # 0.15.15 https://docs.astral.sh/ruff/rules/
    # =========================================================================
    # Базовые правила (Pyflakes, pycodestyle)
    # =========================================================================
    "F", # Pyflakes
    "E", # Pycodestyle Error
    "W", # Pycodestyle Warning

    # =========================================================================
    # ГРУППЫ ПРАВИЛ (в порядке, как на сайте docs.astral.sh/ruff/rules/)
    # =========================================================================
    "AIR", # Airflow
    "ERA", # eradicate
    "FAST", # FastAPI
    "YTT", # flake8-2020
    "ANN", # flake8-annotations
    "ASYNC", # flake8-async
    "S", # flake8-bandit
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "COM", # flake8-commas
    "C4", # flake8-comprehensions
    "CPY", # flake8-copyright
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "DJ", # flake8-django
    "EM", # flake8-errmsg
    "EXE", # flake8-executable
    "FIX", # flake8-fixme
    "FA", # flake8-future-annotations
    "INT", # flake8-gettext
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "LOG", # flake8-logging
    "G", # flake8-logging-format
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "PT", # flake8-pytest-style
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SIM", # flake8-simplify
    "SLOT", # flake8-slots
    "TID", # flake8-tidy-imports
    "TD", # flake8-todos
    "TC", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "FLY", # flynt
    "I", # isort
    "C90", # mccabe
    "NPY", # NumPy-specific rules
    "PD", # pandas-vet
    "N", # pep8-naming
    "PERF", # Perflint
    "DOC", # pydoclint
    "D", # pydocstyle
    "PGH", # pygrep-hooks
    "PL", # Pylint
    "UP", # pyupgrade
    "RUF", # Ruff-specific rules
    "TRY", # tryceratops
]
ignore = [
    "RUF001",
    "RUF003",
    "RUF002",
    "RUF015",
]

[lint.isort]
known-first-party = ["src"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder"
]

[lint.per-file-ignores]
"tests/**/*.py" = [
    "E501",
    "ANN",
    "S",
    "F811"
]
"scripts/**/*.py" = [
    "E501",
    "T20"
]
"**/migrations/*.py" = [
    "E501",
    "F811",
    "F401"
]
"**/generated/*.py" = [
    "F811",
    "E501"
]

[lint.pydocstyle]
convention = "google"
